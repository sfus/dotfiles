watch = false
theme = "github-dark-default"
mode = "unified"
line_numbers = true
wrap_lines = true
hunk_headers = true
menu_bar = true
agent_notes = true
copy_decorations = false
cursor_line = "row"
sidebar = true

[keybindings]
"hunk.app.toggleFocusArea" = "shift+tab"
"hunk.review.saveNote" = ["alt+enter", "ctrl+s"]
